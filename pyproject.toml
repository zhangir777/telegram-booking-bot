[project]
name = "telegram-booking-bot"
version = "1.0.0"
description = "Telegram booking bot for salons, barbers and tutors (aiogram 3, RU/KZ/EN)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22",
    "apscheduler>=3.11,<4",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "tzdata>=2025.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
seed-demo = "scripts.seed_demo:main"

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "scripts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
